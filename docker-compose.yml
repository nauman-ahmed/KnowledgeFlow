services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: knowledgeflow-postgres
    environment:
      POSTGRES_USER: knowledgeflow
      POSTGRES_PASSWORD: knowledgeflow
      POSTGRES_DB: knowledgeflow
    ports:
      # 5433 avoids conflict with a local Postgres on 5432 (common on macOS)
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knowledgeflow -d knowledgeflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: knowledgeflow-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5-community
    container_name: knowledgeflow-neo4j
    environment:
      NEO4J_AUTH: neo4j/knowledgeflow
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p knowledgeflow 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:
  neo4j_data:
