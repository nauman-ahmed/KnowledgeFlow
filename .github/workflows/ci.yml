name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    runs-on: ubuntu-latest
    # The API tests need Postgres with pgvector, as in docker-compose.yml
    # (port 5433 matches the default DATABASE_URL in app/core/config.py).
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: knowledgeflow
          POSTGRES_PASSWORD: knowledgeflow
          POSTGRES_DB: knowledgeflow
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U knowledgeflow -d knowledgeflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend
        run: pip install -e "./backend[dev]"
      - name: Ruff
        run: ruff check backend/app backend/tests
      - name: Pytest
        run: pytest backend/tests

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: ESLint
        working-directory: frontend
        run: npm run lint
